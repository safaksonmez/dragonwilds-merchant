name: Validate merchant source and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development test runtime
        run: python -m pip install -r mods/merchant/requirements-dev.txt
      - name: Check Lua syntax, catalog rules, and storefront contracts
        run: python mods/merchant/scripts/test.py
      - name: Check generated native content is current
        run: |
          python mods/merchant/scripts/build-native-content.py
          git diff --exit-code -- mods/merchant/src
      - name: Build and verify the RuneSchema install archive
        shell: pwsh
        run: ./mods/merchant/scripts/package.ps1 -Force
